name: Build DTB bank

on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'
  push:
    paths:
      - kernels.yaml
      - scripts/build_dtbs.py
      - requirements.txt
      - .github/workflows/build-dtbs.yml

permissions:
  contents: write

concurrency:
  group: dtb-bank-releases
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf libssl-dev make
          python -m pip install -r requirements.txt
      - name: Test configuration handling
        run: python -m unittest discover -s tests -v
      - name: Build and publish missing releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/build_dtbs.py kernels.yaml
